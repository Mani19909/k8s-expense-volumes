apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
    purpose: helm
    
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
      purpose: helm
  template:
    metadata:
      labels:
        app: nginx
        purpose: helm
    spec:
      containers:
      - name: nginx
        image: nginx  